[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openai_cost_calculator"
version = "1.2.0"
description = "A library to estimate OpenAI API costs based on token usage."
authors = [
    { name = "Orkun Kınay, Murat Barkın Kınay", email = "orkunkinay@sabanciuniv.edu" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
proxy = [
    "fastapi",
    "httpx",
    "uvicorn",
    "websockets>=13",
]

[project.scripts]
openai-cost-calculator = "openai_cost_calculator.cli:main"
occ-cc-statusline = "openai_cost_calculator.adapters.claude_code:statusline_main"
occ-cc-stop-hook = "openai_cost_calculator.adapters.claude_code:stop_hook_main"
occ-claude-statusline = "openai_cost_calculator.adapters.claude_proxy:statusline_main"
occ-claude-hook = "openai_cost_calculator.adapters.claude_proxy:hook_main"
occ-codex-notify = "openai_cost_calculator.adapters.codex:notify_main"
occ-codex-statusline = "openai_cost_calculator.adapters.codex:statusline_main"

[tool.setuptools.packages.find]
include = ["openai_cost_calculator*"]

[tool.setuptools.package-data]
openai_cost_calculator = ["data/pricing/*.json", "py.typed"]

[project.urls]
Homepage = "https://github.com/orkunkinay/openai_cost_calculator"
Repository = "https://github.com/orkunkinay/openai_cost_calculator"
Issues = "https://github.com/orkunkinay/openai_cost_calculator/issues"

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["openai_cost_calculator"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

# The provider-agnostic core is fully typed and checked strictly.
[[tool.mypy.overrides]]
module = [
    "openai_cost_calculator.catalog.*",
    "openai_cost_calculator.providers.*",
    "openai_cost_calculator.sync.*",
    "openai_cost_calculator.api",
    "openai_cost_calculator.usage",
    "openai_cost_calculator.legacy",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Pre-existing integration modules predate type checking; their findings are
# tracked for follow-up rather than silenced piecemeal.
[[tool.mypy.overrides]]
module = [
    "openai_cost_calculator.adapters.*",
    "openai_cost_calculator.proxy.*",
    "openai_cost_calculator.cli",
    "openai_cost_calculator.estimate",
    "openai_cost_calculator.pricing",
]
ignore_errors = true
